<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>사천성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #4f8cff 0%, #6b5cff 55%, #8a4fe0 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #stage { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px; }
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 12px; font-variant-numeric:tabular-nums; }
  #hud .item {
    display:flex; align-items:baseline; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:2px 12px; overflow:hidden; min-width:0;   /* 숫자가 길어져도 알약 밖으로 나가지 않게 (game.js 가 글자 크기를 줄여 맞춘다) */
  }
  /* 남는 폭을 점수 3 : 최고 기록 2 로 나눈다 (예전엔 최고 기록 알약이 숫자만큼 늘어나서 점수 알약이 눌렸다) */
  #hud .item:first-child { background:var(--yellow); flex:3 1 0; min-width:0; }
  #hud .item:nth-child(2) { flex:2 1 0; }
  #hud .item.nolabel .label { display:none; }
  #hud .label { font-size:11px; color:var(--muted); }
  #hud .value { font-size:21px; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink);
    width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer; box-shadow:0 4px 0 var(--ink);
  }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  @media (max-width:360px) { #hud .label { display:none; } }
  #wrap { position:relative; }
  #game { display:block; touch-action:none; cursor:pointer; }
  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px;
    text-align:center; padding:20px;
    background:rgba(43,29,82,.58); border-radius:24px; backdrop-filter:blur(3px);
    overflow-y:auto; touch-action:pan-y;
  }
  #overlay.hidden { display:none; }
  #overlay h1, .inked { color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay h1 { font-size:clamp(44px, 13vw, 56px); line-height:1.05; color:#ffd23f; }
  #overlay h1 .p { color:#7ee39a; }
  #overlay h2 { font-size:32px; font-weight:400; }
  #overlay p { font-size:15px; line-height:1.6; color:#fff; }
  #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .big { font-size:48px; color:var(--yellow); font-variant-numeric:tabular-nums; line-height:1; }
  #overlay .tag {
    display:inline-block; background:var(--pink); color:#fff; font-size:15px;
    padding:3px 14px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink);
  }
  #overlay .card {
    font-size:14px; color:var(--ink); line-height:1.75; text-align:left;
    background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink);
    padding:10px 16px;
  }
  #overlay .stats { display:grid; grid-template-columns:auto auto; gap:4px 18px; text-align:left; font-size:16px; font-variant-numeric:tabular-nums; }
  #overlay .stats dt { color:var(--muted); text-align:right; }
  #overlay button {
    background:var(--yellow); color:var(--ink); font-size:22px; font-family:inherit;
    border:3px solid var(--ink); border-radius:999px; padding:10px 40px;
    box-shadow:0 6px 0 var(--ink); cursor:pointer;
  }
  #overlay button:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  @media (max-height:700px) {
    #overlay { gap:8px; padding:12px; }
    #overlay h1 { font-size:38px; }
    #overlay p { font-size:13px; }
    #overlay .card { font-size:12px; padding:7px 12px; line-height:1.6; }
    #overlay button { font-size:19px; padding:8px 32px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
      <div class="item"><span class="label">BEST</span><span class="value" id="best">0</span></div>
      <div class="icons">
        <button id="muteBtn" title="소리 (M)">🔊</button>
        <button id="pauseBtn" title="일시정지 (P)">⏸</button>
      </div>
    </div>
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="overlay">
        <h1>사천<span class="p">성</span></h1>
        <p>같은 그림 두 개를 <b>두 번 이하로 꺾이는 선</b>으로<br>이어서 판을 모두 비우세요!</p>
        <button id="startBtn">시작하기</button>
        <div class="card">
          👆 같은 그림 두 개를 차례로 누르기<br>
          ↪️ 다른 패는 못 넘고, 판 바깥으론 돌아가요<br>
          💡 힌트 · 🔀 섞기는 단계마다 다시 채워져요<br>
          ⏰ 시간 안에 다 비우면 다음 단계! 남은 시간은 보너스 점수로<br>
          📈 단계가 오를수록 그림 종류와 패가 늘어나요
        </div>
      </div>
    </div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
